name: zette_ui
description: A set of useful functions and libraries used in almost all Zette flutter apps.
version: 0.0.4+1
homepage: https://zette.dev
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.35.1

dependencies:
  app_links: ^6.4.1
  auto_size_text: ^3.0.0
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.1.0
  go_router: ^16.2.1
  intl: ^0.20.2
  local_auth: ^2.3.0
  sentry_flutter: ^9.6.0
  url_launcher: ^6.3.2
  zette_utils:
    git:
      url: https://github.com/zette-dev/flutter-utils.git
      ref: flutter-3.35.1
      path: utils

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.11.1
