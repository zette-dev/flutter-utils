name: zette_ui
description: A set of useful functions and libraries used in almost all Zette flutter apps.
version: 0.0.4+1
homepage: https://zette.dev
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ^3.47.0

dependencies:
  app_links: ^7.2.1
  auto_size_text: ^3.0.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  marionette_flutter: ^0.6.0
  sentry_flutter: ^9.30.1
  url_launcher: ^6.3.2
  zette_utils:
    path: ../utils

dev_dependencies:
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  marionette_mcp: ^0.6.0
