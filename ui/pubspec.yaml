name: zette_ui
description: A set of useful functions and libraries used in almost all Zette flutter apps.
version: 0.0.4+1
homepage: https://zette.dev
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: 3.38.9

dependencies:
  app_links: ^7.0.0
  auto_size_text: ^3.0.0
  dio: ^5.9.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.0
  marionette_flutter: ^0.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  intl: ^0.20.2
  local_auth: ^3.0.0
  sentry_flutter: ^9.10.0
  url_launcher: ^6.3.2
  zette_utils:
    git:
      url: https://github.com/zette-dev/flutter-utils.git
      ref: latest
      path: utils

dev_dependencies:
  build_runner: ^2.10.5
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  marionette_mcp: ^0.3.0
