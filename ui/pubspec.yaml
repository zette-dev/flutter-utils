name: zette_ui
description: A set of useful functions and libraries used in almost all Zette flutter apps.
version: 0.0.4+1
homepage: https://zette.dev
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.35.4

dependencies:
  app_links: ^6.4.0
  auto_size_text: ^3.0.0
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  go_router: ^15.1.3
  intl: ^0.20.2
  local_auth: ^2.3.0
  sentry_flutter: ^9.1.0
  url_launcher: ^6.3.1
  zette_utils:
    git:
      url: https://github.com/zette-dev/flutter-utils.git
      ref: latest
      path: utils

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
