  dio: ^5.8.0+1
  freezed_annotation: ^3.0.0
  intl: ^0.20.2
  logger: ^2.6.0
  ms_map_utils: ^1.1.0
  riverpod: ^2.6.1
  rxdart: ^0.28.0
  sentry: ^9.1.0
  sentry_dio: ^9.1.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
