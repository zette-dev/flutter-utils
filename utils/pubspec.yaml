  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  logger: ^2.7.0
  ms_map_utils: ^1.1.0
  riverpod: ^3.4.2
  rxdart: ^0.28.0
  sentry: ^9.28.0
  sentry_dio: ^9.28.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
