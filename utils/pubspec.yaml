version: 1.0.0
homepage: https://zette.dev
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cross_file: ^0.3.4+2
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  logger: ^2.6.2
  ms_map_utils: ^1.1.0
  riverpod: ^3.0.3
  rxdart: ^0.28.0
  sentry: ^9.6.0
  sentry_dio: ^9.7.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.10.1
  freezed: ^3.2.3
